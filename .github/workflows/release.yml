name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

env:
  TYPST_DOCS_REF: v0.15.0

jobs:
  docs:
    name: Build Typst documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out tedit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check out Typst
        uses: actions/checkout@v4
        with:
          repository: typst/typst
          ref: ${{ env.TYPST_DOCS_REF }}
          path: typst-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node -e "const version = require('./package.json').version; if ('v' + version !== process.env.RELEASE_TAG) throw new Error('Package version ' + version + ' does not match ' + process.env.RELEASE_TAG)"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: typst-source

      - name: Build documentation
        run: npm run package-docs -- typst-source

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: typst-docs
          path: resources/typst-docs
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    needs: docs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            artifact_name: installer-linux-x64
            os: ubuntu-latest
            package_platform: linux
            package_arch: x64
            command: npx electron-builder --linux AppImage --x64 --publish never
            files: release/*.AppImage
          - name: Windows x64
            artifact_name: installer-windows-x64
            os: windows-latest
            package_platform: win32
            package_arch: x64
            command: npx electron-builder --win nsis --x64 --publish never
            files: release/*.exe
          - name: macOS x64
            artifact_name: installer-macos-x64
            os: macos-latest
            package_platform: darwin
            package_arch: x64
            command: npx electron-builder --mac dmg --x64 --publish never
            files: release/*.dmg
          - name: macOS arm64
            artifact_name: installer-macos-arm64
            os: macos-latest
            package_platform: darwin
            package_arch: arm64
            command: npx electron-builder --mac dmg --arm64 --publish never
            files: release/*.dmg

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download documentation
        uses: actions/download-artifact@v4
        with:
          name: typst-docs
          path: resources/typst-docs

      - name: Build application
        run: npm run build

      - name: Package Tinymist
        run: npm run package-tinymist -- --platform ${{ matrix.package_platform }} --arch ${{ matrix.package_arch }}

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum release-artifacts/* > release-artifacts/SHA256SUMS.txt

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: release-artifacts/*
